<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World map demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c272d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  WORLD MAP DEMO — 9:16, 6.0s @ 120 BPM, 24fps. The 49th parallel draws across a peninsula and cuts its tip
//  off as U.S. land (Point Roberts); the camera zooms in, a pin drops. The tip morphs out to the wider map,
//  where the drive home runs 25 miles through Canada and a counter ticks two border crossings.
//  Facts: Point Roberts, Washington; 1846 Oregon Treaty set the line on the 49th parallel; reachable by land
//  from the rest of the U.S. only through Canada, ~25 miles (en.wikipedia.org/wiki/Point_Roberts,_Washington).
//  Build: node <skill>/tools/build.mjs <project>/styles/world-map/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneCut()], [3, 6, () => sceneDrive()]];
const SHOTS = [
  ['cut',   0, 0.0, 3.0, 'the 49th parallel cuts the tip off a peninsula; zoom to Point Roberts'],
  ['drive', 1, 3.0, 6.0, 'the drive home runs through Canada: two border crossings'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { labels: 0.15, line: 0.4, fill: 1.0, zoom: 0.95, pin: 1.75, name: 1.95, route: 3.55, routeEnd: 5.3 },
  acts: [
    { name: '1 The cut', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 The drive', role: 'gift', t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.0, title: 'the 49th parallel splits the land', sound: 'pluck run, pops on labels', next: 'zoom to the tip' },
    { t: 2.3, title: 'pin drops on Point Roberts', sound: 'whoosh, pin thud', next: 'the tip becomes the wide map' },
    { t: 5.6, title: 'two border crossings', sound: 'counter ticks, resolve', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
