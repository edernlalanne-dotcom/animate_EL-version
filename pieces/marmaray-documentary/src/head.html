<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How engineers built the Marmaray undersea tunnel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1d33; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  HOW ENGINEERS BUILT THE MARMARAY UNDERSEA TUNNEL — a 3D documentary, 16:9, navy / turquoise / concrete / amber.
//  The voice-over (Jeremy) is the clock: each scene starts on a spoken line.
//  Build: node <skill>/tools/build.mjs <this piece dir>
// =====================================================================
const FPS = 24, W = 1920, H = 1080;
const DURATION = VOICE.duration;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 110, right: 60 };
const CX = W / 2;
const VL = (id) => VOICE.lines.find((l) => l.id === id).t0;   // the start of a spoken line

const cu = {
  hook: VL('hook'), open: VL('open'), ask: VL('ask'), deep: VL('deep'), window: VL('window'), cast: VL('cast'),
  tow: VL('tow'), trench: VL('trench'), sink: VL('sink'), bed: VL('bed'), seal: VL('seal'), connect: VL('connect'),
  end: VL('end'), title: VL('title'),
};
// the scenes, cut on the voice-over
const ERA_LIST = [
  [0,                 cu.open - 0.1,    () => sceneHook()],
  [cu.open - 0.1,     cu.ask - 0.1,     () => sceneAerial()],
  [cu.ask - 0.1,      cu.window - 0.1,  () => sceneDepth()],
  [cu.window - 0.1,   cu.cast - 0.1,    () => sceneCurrent()],
  [cu.cast - 0.1,     cu.tow - 0.1,     () => sceneCast()],
  [cu.tow - 0.1,      cu.trench - 0.1,  () => sceneTow()],
  [cu.trench - 0.1,   cu.sink - 0.1,    () => sceneTrench()],
  [cu.sink - 0.1,     cu.bed - 0.1,     () => sceneSink()],
  [cu.bed - 0.1,      cu.seal - 0.1,    () => sceneBed()],
  [cu.seal - 0.1,     cu.connect - 0.1, () => sceneSeal()],
  [cu.connect - 0.1,  cu.end - 0.1,     () => sceneConnect()],
  [cu.end - 0.1,      cu.title - 0.1,   () => sceneEnd()],
  [cu.title - 0.1,    DURATION,         () => sceneTitle()],
];
const SHOTS = [
  ['teaser',  0,  0,                 cu.open - 0.1,    'the train inside the tube, before any question'],
  ['aerial',  1,  cu.open - 0.1,     cu.ask - 0.1,     'Istanbul from the air; the route of the tube'],
  ['depth',   2,  cu.ask - 0.1,      cu.window - 0.1,  'challenge one: 60 m, beside a 20-storey tower'],
  ['current', 3,  cu.window - 0.1,   cu.cast - 0.1,    'challenge two: the current'],
  ['cast',    4,  cu.cast - 0.1,     cu.tow - 0.1,     'a 135 m section beside a bus and a football pitch'],
  ['tow',     5,  cu.tow - 0.1,      cu.trench - 0.1,  'a tug takes a section to the strait'],
  ['trench',  6,  cu.trench - 0.1,   cu.sink - 0.1,    'a trench dredged 14 m down'],
  ['sink',    7,  cu.sink - 0.1,     cu.bed - 0.1,     'the section lowered, its tanks taking in water'],
  ['bed',     8,  cu.bed - 0.1,      cu.seal - 0.1,    'gravel levelled, grout under the tube'],
  ['seal',    9,  cu.seal - 0.1,     cu.connect - 0.1, 'the gasket seals the joint, the water is pumped out'],
  ['shores',  10, cu.connect - 0.1,  cu.end - 0.1,     'the land cut away, a bored tunnel into the hill'],
  ['finish',  11, cu.end - 0.1,      cu.title - 0.1,   'the train runs through the tube, followed'],
  ['title',   12, cu.title - 0.1,    DURATION,         'the title card'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: 120, gridOffset: 0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '16:9',
  format: 'F2',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: ERA_LIST.slice(1).map((e) => e[0]),
  morphs: [],
  cues: { ...cu },
  acts: [
    { name: '1 Overview', role: 'build', t0: 0, t1: cu.cast - 0.1 },
    { name: '2 Build',    role: 'build', t0: cu.cast - 0.1, t1: cu.seal - 0.1 },
    { name: '3 Join',     role: 'gift',  t0: cu.seal - 0.1, t1: DURATION },
  ],
  board: SHOTS.map(([key, era, t0, t1, title]) => ({ t: t0 + 0.6, title, sound: 'a low pad; soft moves', next: 'cut' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
