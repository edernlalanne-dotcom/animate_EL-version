<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How aircraft cabins keep air fresh</title>
<style>
  html, body { margin: 0; height: 100%; background: #060d19; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  WORLD IN THE MAKING: How modern aircraft cabins keep air fresh and pressurized at cruising altitude.
//  9:16, 24fps, narrated by ElevenLabs "Jeremy - Casual Guy Next Door". The voice is the clock: every scene starts
//  a quarter second before its line. Style: cutaway (navy ground, cyan fresh air, teal recirculated air,
//  amber compressed air, red warnings only). Last 2s: the channel subscribe card.
//  Facts: cabin altitude max 8,000 ft (14 CFR 25.841); ISA at 35,000 ft: 23.8 kPa = 0.235 atm, -54 C;
//  packs = air cycle machine (compressor, heat exchangers, turbine); ~50% recirculated through HEPA;
//  787 uses electric compressors and no bleed, cabin ~6,000 ft; horn above 10,000 ft, masks near 14,000 ft.
// =====================================================================
const FORMAT = '9:16', FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = (W - SAFE.right) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const DURATION = VOICE.duration, NFRAMES = Math.round(DURATION * FPS), LOOP_T = NFRAMES / FPS;
// voice helpers
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const clean = (s) => s.toLowerCase().replace(/[^a-z0-9-]/g, '');
const VW = (id, word, n = 1) => { const L = VL(id); let k = 0; for (const w of L.words) if (clean(w.w) === clean(word) && ++k === n) return w.t0; return L.t0; };   // when the n-th `word` starts
const VS = (id, n) => { const L = VL(id); let k = 0; if (n === 0) return L.t0; for (let i = 1; i < L.words.length; i++) if (/[.?!]$/.test(L.words[i - 1].w) && ++k === n) return L.words[i].t0; return L.t1; };   // when the n-th sentence starts
const CARD0 = DURATION - 2.0;   // the subscribe card: the last 2 seconds
const cutAt = (id) => onBeat(VL(id).t0 - 0.25);
const ERA_T = [0, cutAt('tube'), cutAt('level'), cutAt('bleed'), cutAt('pack'), cutAt('flow'), cutAt('hepa'), cutAt('valve'), cutAt('b787'), cutAt('warn'), cutAt('payoff'), cutAt('cta'), DURATION];
const ERA_LIST = [
  [ERA_T[0], ERA_T[1], () => sceneHook()], [ERA_T[1], ERA_T[2], () => sceneTube()], [ERA_T[2], ERA_T[3], () => sceneLevel()],
  [ERA_T[3], ERA_T[4], () => sceneBleed()], [ERA_T[4], ERA_T[5], () => scenePack()], [ERA_T[5], ERA_T[6], () => sceneFlow()],
  [ERA_T[6], ERA_T[7], () => sceneHepa()], [ERA_T[7], ERA_T[8], () => sceneValve()], [ERA_T[8], ERA_T[9], () => scene787()],
  [ERA_T[9], ERA_T[10], () => sceneWarn()], [ERA_T[10], ERA_T[11], () => scenePayoff()], [ERA_T[11], DURATION, () => sceneEnd()],
];
const SHOTS = [
  ['hook', 0, 'cruise, dive through the window: why a T-shirt at minus 54?'],
  ['tube', 1, 'outside pressure a quarter of sea level; the sealed tube'],
  ['level', 2, 'cabin altitude 6,000 to 8,000 ft, capped at 8,000'],
  ['bleed', 3, 'engine compressor, bleed air, far too hot'],
  ['pack', 4, 'air conditioning pack: squeeze, cool, expand, amber to cyan'],
  ['flow', 5, 'ceiling outlets, air sinks to the floor'],
  ['hepa', 6, 'half recirculates through HEPA, 2 to 3 minute change'],
  ['valve', 7, 'outflow valve sets the pressure'],
  ['b787', 8, 'the 787: electric compressors, no bleed'],
  ['warn', 9, 'pressure drop: horn at 10,000, masks near 14,000'],
  ['payoff', 10, 'valves move, fans spin, coffee at minus 54'],
  ['end', 11, 'subscribe, then the channel card for 2s'],
].map(([key, era, title], i) => ({ id: i + 1, key, era, t0: ERA_T[era], t1: ERA_T[era + 1], title }));
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'machine-process',
  shots: SHOTS,
  cuts: ERA_T.slice(1, -1),
  morphs: [],
  cues: { card: CARD0, warnLow: VS('warn', 1), silence: VL('warn').t1, payoff: VL('payoff').t0 },
  acts: [
    { name: '1 Hook', role: 'journey', t0: 0, t1: ERA_T[3] },
    { name: '2 Machines', role: 'journey', t0: ERA_T[3], t1: ERA_T[9] },
    { name: '3 Turn', role: 'peak', t0: ERA_T[9], t1: VL('warn').t1 },
    { name: '4 Calm', role: 'silence', t0: VL('warn').t1, t1: VL('payoff').t0 },
    { name: '5 Payoff', role: 'gift', t0: VL('payoff').t0, t1: ERA_T[11] },
    { name: '6 Card', role: 'goodbye', t0: ERA_T[11], t1: DURATION },
  ],
  board: [
    { t: 3.0, title: 'cruise at minus 54', sound: 'low drone, wind', next: 'dive through the window' },
    { t: 9.5, title: 'the passenger in a T-shirt', sound: 'cabin hush', next: 'dive into the pressure bars' },
    { t: ERA_T[1] + 6.5, title: 'the sealed tube', sound: 'seal thump', next: 'to the mountain scale' },
    { t: ERA_T[2] + 5.0, title: 'mountain town, 8,000 cap', sound: 'stamp', next: 'dive into the engine' },
    { t: ERA_T[3] + 8.0, title: 'compressor squeezes, bleed taps off', sound: 'whine rises', next: 'follow the pipe' },
    { t: ERA_T[4] + 6.0, title: 'the pack: amber to cyan', sound: 'turbine spool', next: 'into the cabin' },
    { t: ERA_T[5] + 2.5, title: 'air sinks past passengers', sound: 'soft air', next: 'under the floor' },
    { t: ERA_T[6] + 6.0, title: 'HEPA close-up', sound: 'fan hum', next: 'to the rear belly' },
    { t: ERA_T[7] + 6.5, title: 'the outflow valve', sound: 'valve servo', next: 'the 787' },
    { t: ERA_T[8] + 7.0, title: '787 electric compressors', sound: 'electric whine', next: 'red gauge' },
    { t: ERA_T[9] + 5.5, title: 'warning: horn, masks', sound: 'horn then silence', next: 'calm' },
    { t: ERA_T[10] + 6.0, title: 'coffee at minus 54', sound: 'warm chord', next: 'subscribe' },
    { t: CARD0 + 1.0, title: 'channel card', sound: 'fade', next: 'end' },
  ],
  narration: VOICE.lines.map((l) => ({ id: l.id, text: l.text, t0: l.t0, t1: l.t1 })),
};
window.TIMELINE = TIMELINE;
