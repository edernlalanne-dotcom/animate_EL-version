<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How aircraft cabins keep air fresh</title>
<style>
  html, body { margin: 0; height: 100%; background: #060d19; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  WORLD IN THE MAKING: How modern aircraft cabins keep air fresh and pressurized at cruising altitude.
//  9:16, 24fps, narrated by ElevenLabs "Jeremy - Casual Guy Next Door". The voice is the clock: every scene starts
//  a quarter second before its line. Style: cutaway (navy ground, cyan fresh air, teal recirculated air,
//  amber compressed air, red warnings only). Last 2s: the channel subscribe card.
//  Facts: cabin altitude max 8,000 ft (14 CFR 25.841); ISA at 35,000 ft: 23.8 kPa = 0.235 atm, -54 C;
//  packs = air cycle machine (compressor, heat exchangers, turbine); ~50% recirculated through HEPA;
//  787 uses electric compressors and no bleed, cabin ~6,000 ft; horn above 10,000 ft, masks near 14,000 ft.
// =====================================================================
const FORMAT = '9:16', FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = (W - SAFE.right) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const DURATION = VOICE.duration, NFRAMES = Math.round(DURATION * FPS), LOOP_T = NFRAMES / FPS;
// voice helpers
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const clean = (s) => s.toLowerCase().replace(/[^a-z0-9-]/g, '');
const VW = (id, word, n = 1) => { const L = VL(id); let k = 0; for (const w of L.words) if (clean(w.w) === clean(word) && ++k === n) return w.t0; return L.t0; };   // when the n-th `word` starts
const VS = (id, n) => { const L = VL(id); let k = 0; if (n === 0) return L.t0; for (let i = 1; i < L.words.length; i++) if (/[.?!]$/.test(L.words[i - 1].w) && ++k === n) return L.words[i].t0; return L.t1; };   // when the n-th sentence starts
const CARD0 = DURATION - 2.0;   // the subscribe card: the last 2 seconds
const cutAt = (id) => onBeat(VL(id).t0 - 0.25);
const IDS = ['open', 'breath', 'seal', 'stale', 'engine', 'cabin', 'valve', 'warn', 'b787', 'close', 'cta'];
const ERA_T = [0, ...IDS.slice(1).map(cutAt), DURATION];
const ERA_LIST = [
  [ERA_T[0], ERA_T[1], () => sceneHook()], [ERA_T[1], ERA_T[2], () => sceneBreath()], [ERA_T[2], ERA_T[3], () => sceneSeal()],
  [ERA_T[3], ERA_T[4], () => sceneStale()], [ERA_T[4], ERA_T[5], () => sceneEngine()], [ERA_T[5], ERA_T[6], () => sceneCabin()],
  [ERA_T[6], ERA_T[7], () => sceneValve()], [ERA_T[7], ERA_T[8], () => sceneWarn()], [ERA_T[8], ERA_T[9], () => scene787()],
  [ERA_T[9], ERA_T[10], () => sceneClose()], [ERA_T[10], DURATION, () => sceneEnd()],
];
const TITLES = ['window, minus 54, why a T-shirt?', 'a breath holds a quarter of the oxygen', 'sealed tube, fake mountain town, 8,000 ft cap', 'stale air, one failure gives seconds', 'engine squeeze, bleed air, pack chills: amber to cyan', 'ceiling air, HEPA, renewed in minutes', 'the outflow valve sets the pressure', 'horn at 10,000, masks, almost never', 'the 787: electric compressors', 'the answer: a sealed warm bubble', 'subscribe, then the channel card'];
const SHOTS = TITLES.map((title, i) => ({ id: i + 1, key: IDS[i], era: i, t0: ERA_T[i], t1: ERA_T[i + 1], title }));
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'machine-process',
  shots: SHOTS,
  cuts: ERA_T.slice(1, -1),
  morphs: [],
  cues: { card: CARD0, silence: VL('warn').t1, payoff: ERA_T[9] },
  acts: [
    { name: '1 Hook', role: 'journey', t0: 0, t1: ERA_T[3] },
    { name: '2 Machines', role: 'journey', t0: ERA_T[3], t1: ERA_T[7] },
    { name: '3 Turn', role: 'peak', t0: ERA_T[7], t1: VL('warn').t1 },
    { name: '4 Calm', role: 'silence', t0: VL('warn').t1, t1: ERA_T[8] },
    { name: '5 Answer', role: 'gift', t0: ERA_T[9], t1: ERA_T[10] },
    { name: '6 Card', role: 'goodbye', t0: ERA_T[10], t1: DURATION },
  ],
  board: ERA_T.slice(0, -1).map((t, i) => ({ t: t + (ERA_T[i + 1] - t) * 0.6, title: TITLES[i], sound: 'score and voice', next: IDS[i + 1] || 'end' })).concat([{ t: CARD0 + 1.0, title: 'channel card', sound: 'fade', next: 'end' }]),
  narration: VOICE.lines.map((l) => ({ id: l.id, text: l.text, t0: l.t0, t1: l.t1 })),
};
window.TIMELINE = TIMELINE;
