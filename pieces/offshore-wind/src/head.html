<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Offshore Wind Turbines Are Assembled at Sea</title>
<style>
  html, body { margin: 0; height: 100%; background: #050d1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  HOW OFFSHORE WIND TURBINES ARE ASSEMBLED AT SEA — World in the Making. 16:9, 24fps, ~87s.
//  Six construction stages cut hard, then a 2s subscribe end card (assets/subscribe.png).
//  Voice-over: Jeremy - Casual Guy Next Door (ElevenLabs). The voice is the clock: scene starts come from VOICE.
// =====================================================================
const FORMATS = { '16:9': [1920, 1080], '9:16': [1080, 1920] };
const FORMAT = new URLSearchParams(location.search).get('format') || '16:9';
const FPS = 24, [W, H] = FORMATS[FORMAT];
const WW = 1920;   // the width of the world the scenes are drawn in; W, H = the canvas (PORTRAIT comes from kit/core.js)
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const SAFE = H > W ? { top: 240, bottom: 420, right: 140 } : { top: 60, bottom: 110, right: 60 };
const CX = W / 2;
// scene starts [t0, t1] in seconds. With a voice-over they follow the spoken lines (see SCENE_FROM_VOICE below).
const SC = {
  open:  [0, 8], found: [8, 23], jack: [23, 38], lift: [38, 57], blade: [57, 73], farm: [73, 85], end: [85, 87],
};
if (typeof VOICE !== 'undefined') {
  const L = Object.fromEntries(VOICE.lines.map((l) => [l.id, l]));
  const at = (id, pre = 0.0) => +(L[id].t0 - pre).toFixed(3);
  const snap = (x) => Math.round(x / 0.25) * 0.25;   // cuts land on the 8th grid (0.25s at 120 BPM)
  const starts = [0, snap(at('found1', 0.4)), snap(at('jack1', 1.0)), snap(at('tower1', 2.4)), snap(at('blade1', 0.8)), snap(at('power1', 0.6))];
  const endAll = Math.ceil((L.end.t1 + 0.5) / 0.25) * 0.25;
  const keys = ['open', 'found', 'jack', 'lift', 'blade', 'farm'];
  keys.forEach((k, i) => { SC[k] = [starts[i], i + 1 < keys.length ? starts[i + 1] : endAll]; });
  SC.end = [endAll, +(endAll + 2).toFixed(3)];
}
const DURATION = +SC.end[1].toFixed(3);
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const ERA_LIST = [
  [SC.open[0], SC.open[1], () => sceneOpen()], [SC.found[0], SC.found[1], () => sceneFound()], [SC.jack[0], SC.jack[1], () => sceneJack()],
  [SC.lift[0], SC.lift[1], () => sceneLift()], [SC.blade[0], SC.blade[1], () => sceneBlade()], [SC.farm[0], SC.farm[1], () => sceneFarm()],
  [SC.end[0], SC.end[1], () => sceneEnd()],
];
const SHOTS = [
  ['open', 0, 'the turbine towers; the shore is far away'], ['found', 1, 'the monopile goes into the seabed; the transition piece lands'],
  ['jack', 2, 'the jack-up vessel stands on the seabed and lifts its hull above the waves'], ['lift', 3, 'tower sections and the nacelle go up'],
  ['blade', 4, 'one blade, one gust, one weather window'], ['farm', 5, 'the wind farm, cables, substation, shore'], ['end', 6, 'subscribe card'],
].map(([key, era, title], i) => ({ id: i + 1, key, era, t0: ERA_LIST[era][0], t1: ERA_LIST[era][1], title }));
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',
  shots: SHOTS,
  cuts: ERA_LIST.slice(1).map((e) => e[0]),
  morphs: [],
  cues: {},
  acts: [
    { name: '1 Question', role: 'build', t0: SC.open[0], t1: SC.open[1] },
    { name: '2 Foundation', role: 'journey', t0: SC.found[0], t1: SC.found[1] },
    { name: '3 The ship', role: 'peak', t0: SC.jack[0], t1: SC.jack[1] },
    { name: '4 Assembly', role: 'journey', t0: SC.lift[0], t1: SC.lift[1] },
    { name: '5 Blade', role: 'journey', t0: SC.blade[0], t1: SC.blade[1] },
    { name: '6 Power', role: 'gift', t0: SC.farm[0], t1: SC.end[1] },
  ],
  board: [],
  narration: [],
};
window.TIMELINE = TIMELINE;
